name: qasl-suite

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Filtro de Playwright (por ejemplo @smoke). Vacío = todos los casos"
        required: false
        default: ""

concurrency:
  group: qasl-suite
  cancel-in-progress: false

jobs:
  pruebas:
    name: e2e + API + seguridad + rendimiento → QASL Manual Testing
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CI: "true"
      QASL_URL: http://localhost:4100
      QASL_TOKEN: ${{ secrets.QASL_TOKEN }}
      QASL_PROJECT: TIENDA
      QASL_PLAN: PLAN-01
      QASL_WEB_URL: http://localhost:8081

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install chromium

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Variables de la suite (.env desde .env.example)
        run: node -e "require('fs').copyFileSync('.env.example', '.env')"

      - name: Verificar que QASL Manual Testing responde
        run: node -e "fetch(process.env.QASL_URL + '/api/health').then(r => { if (!r.ok) throw new Error(r.status); console.log('QASL Manual Testing OK'); }).catch(e => { console.error('No responde ' + process.env.QASL_URL + '. Levantalo con docker compose up -d.'); process.exit(1); })"

      - name: Ejecutar pruebas y publicar en QASL
        run: |
          node scripts/allure.mjs clean:results
          npx playwright test ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}

      - name: Rendimiento con k6 al mismo reporte
        if: always()
        run: npm run perf

      - name: Generar reporte de Allure
        if: always()
        run: npm run allure:generate

      - name: Adjuntar el reporte de Allure al Run en QASL
        if: always()
        run: npm run qasl:allure

      - name: Guardar reporte de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report/
            artefactos/k6/informe.html
          retention-days: 14

      - name: Guardar evidencia de las fallas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
